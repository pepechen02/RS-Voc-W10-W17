*{box-sizing:border-box}
body{margin:0;font-family:"jf-huninn","Zen Maru Gothic","Varela Round","Hiragino Maru Gothic ProN","Yu Gothic","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:linear-gradient(160deg,#eef6fb,#f6f0fb);color:var(--tx);display:flex;min-height:100vh}

.nav{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 16px;border-radius:999px;font-size:18px;color:var(--tx);cursor:pointer;font-family:inherit}
.nav.sub{padding-left:30px;color:var(--mu)}
.nav:hover{background:var(--ac-l)}
.nav.on{background:var(--ac);color:#fff}
main{flex:1;padding:28px 32px;min-width:0}
h1{margin:0;font-size:26px}
.subt{color:var(--mu);margin:4px 0 20px}
.tabs{display:inline-flex;background:var(--ac-l);border-radius:999px;padding:6px;gap:4px;margin-bottom:16px}

th{background:var(--ac-l);color:var(--ac);text-align:left;font-size:13px;padding:14px}

.card .no{color:var(--mu);font-size:14px;margin-bottom:6px}
.card .sp{border:0;background:var(--ac-l);color:var(--ac-d);font-weight:700;padding:12px;border-radius:999px;cursor:pointer;font-size:15px;font-family:inherit}
.card .big{font-size:26px;font-weight:700;color:var(--ac-d)}
.card .pos{font-style:italic;color:var(--mu)}.card .zh{font-weight:700}
.card .en{font-size:14px;border-top:1px solid var(--bd);padding-top:10px}.card .tr{font-size:13px;color:var(--mu)}

.q .n{background:var(--ac-l);color:var(--ac-d);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.q .b{flex:1}.q p{margin:0 0 10px;line-height:1.6}
.q input{width:100%;max-width:340px;padding:11px 14px;border:1px solid var(--bd);border-radius:999px;background:var(--bg);font-size:16px;font-family:inherit}
.q.ok{border-left-color:#3a9d5d}.q.no{border-left-color:#d9534f}
.fb{margin-top:8px;font-size:14px;font-weight:600}
.score{font-size:18px;font-weight:700;margin:12px 0;color:var(--ac-d)}
.soon{color:var(--mu);padding:60px 0;text-align:center}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;height:auto;position:static}main{padding:18px}}
.ic{width:1.2em;height:1.2em;vertical-align:-.22em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-right:.4em}
aside h3 .ic{width:1.4em;height:1.4em}
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.hero .subt{margin-bottom:0}
.card .ico{width:44px;height:44px;border-radius:50%;background:var(--ac-l);color:var(--ac-d);display:grid;place-items:center;margin:0 auto}
.card .ico .ic{margin:0;width:22px;height:22px}
</style>

tr:A('<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>'),
li:A('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'),
ca:A('<rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 6V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-2"/>'),
pe:A('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),
sp:A('<path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/>'),
sh:A('<path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/>'),
bk:A('<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15Z"/>')};
const NAV=[["1. Airborn",["W10","W11","W12","W13","W10-W13 Review"]],["2. The Secret Garden",["W14","W15","W16","W17","W14-W17 Review"]],["3. Final Exam Review",[]]];
let cur="W10",tab="list",qmode="listen",lmode="word",order=[],opened=new Set(),qs=[],checked=false;
const $=s=>document.querySelector(s);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;speechSynthesis.speak(u)}
function mask(s,w,r="_____"){return s.replace(new RegExp("\\b"+w+"\\w*","ig"),r)}
function sd(i){speak(mask(DATA[cur][i][3],DATA[cur][i][0],"blank"))}

function side(){
  $("#side").innerHTML=NAV.map(([g,items])=>{
    const head=`<h3>${g.startsWith("1")?I.pl:I.sd}${g}</h3>`;
    const rows=items.map(i=>`<button class="nav sub ${i===cur?"on":""}" onclick="go('${i}')">${i}</button>`).join("");
    return g.startsWith("3")?`<button class="nav ${cur==="FINAL"?"on":""}" onclick="go('FINAL')" style="font-weight:700;color:${cur==="FINAL"?"#fff":"var(--ac-d)"};margin-top:18px">${I.tr}${g}</button>`:head+rows;
  }).join("");
}
function go(w){cur=w;tab="list";order=[];opened.clear();qs=[];side();render()}
function render(){
  const words=DATA[cur];
  if(!words){$("#view").innerHTML=`<div class="soon">${I.bk}${cur==="FINAL"?"Final Exam Review":cur} 內容即將推出</div>`;return}
  if(!order.length)order=words.map((_,i)=>i);
  const tabs=`<div class="tabs">${[["list","Voc List",I.li],["pop","Pop Card",I.ca],["quiz","Quiz",I.pe]].map(([k,l,ic])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';qs=[];render()">${ic}${l}</button>`).join("")}</div>`;
  let body="";
  if(tab==="list")body=`<table><tr><th>週</th><th>單字</th><th>詞性</th><th>中文</th><th>英文定義</th><th>定義翻譯</th></tr>${words.map(w=>`<tr><td><span class="badge">${cur}</span></td><td class="w">${w[0]}</td><td class="pos">${w[1]}</td><td class="zh">${w[2]}</td><td>${w[3]}<br><small style="color:var(--mu)">e.g. ${w[5]}</small></td><td class="tr">${w[4]}</td></tr>`).join("")}</table>`;
  if(tab==="pop")body=`<div class="bar"><button class="btn p" onclick="opened=new Set(order);render()">全部打開</button><button class="btn" onclick="opened.clear();render()">全部關上</button><button class="btn" onclick="order=shuffle(order);opened.clear();render()">${I.sh}Random</button></div><div class="grid">${order.map((i,n)=>{const w=words[i],o=opened.has(i);return o?`<div class="card open" onclick="opened.delete(${i});render()"><div class="big">${w[0]}</div><div class="pos">${w[1]}</div><div class="zh">${w[2]}</div><div class="en">${w[3]}</div><div class="tr">${w[4]}</div></div>`:`<div class="card" onclick="opened.add(${i});render()"><div class="ico">${I.bk}</div><div class="no">${cur} · ${n+1} / ${words.length}</div><button class="sp" onclick="event.stopPropagation();speak(DATA.${cur}[${i}][0])">${I.sp}朗讀單字</button><button class="sp" onclick="event.stopPropagation();speak(DATA.${cur}[${i}][3])">${I.sp}朗讀定義</button></div>`}).join("")}</div>`;
  if(tab==="quiz"){
    if(!qs.length){qs=shuffle(words.map((_,i)=>i));checked=false}
    const desc={listen:lmode==="word"?"聽朗讀單字，輸入單字拼法":"聽朗讀定義（單字會以 blank 代替），輸入單字拼法",def:"看定義，輸入單字拼法",sent:"例句填空，輸入單字"}[qmode];
    body=`<div class="bar">${[["listen","① Listening"],["def","② Definition"],["sent","③ Sentence"]].map(([k,l])=>`<button class="btn ${qmode===k?"p":""}" onclick="qmode='${k}';qs=[];render()">${l}</button>`).join("")}</div>
    ${qmode==="listen"?`<div class="bar">${[["word","朗讀單字"],["def","朗讀定義"]].map(([k,l])=>`<button class="btn ${lmode===k?"p":""}" onclick="lmode='${k}';qs=[];render()">${l}</button>`).join("")}</div>`:""}<div class="bar"><span style="color:var(--mu)">${desc}（範圍 ${cur}，共 ${words.length} 題）</span><span style="flex:1"></span><button class="btn" onclick="qs=[];render()">${I.sh}Random（重新隨機）</button><button class="btn p" onclick="check()">檢查答案</button></div><div id="score" class="score"></div>
    ${qs.map((i,n)=>{const w=words[i];const prompt=qmode==="listen"?(lmode==="word"?`<button class="btn" onclick="speak(DATA.${cur}[${i}][0])">${I.sp}播放單字</button>`:`<button class="btn" onclick="sd(${i})">${I.sp}播放定義</button>`):qmode==="def"?`<p>${esc(mask(w[3],w[0]))}</p>`:`<p>${esc(mask(w[5],w[0]))}</p>`;return`<div class="q" id="q${n}"><div class="n">${n+1}</div><div class="b">${prompt}<br><input id="a${n}" placeholder="輸入拼法" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="fb" id="f${n}"></div></div></div>`}).join("")}`;
  }
  $("#view").innerHTML=tabs+body;
}
function check(){
  let ok=0;
  qs.forEach((i,n)=>{const w=DATA[cur][i][0],v=$("#a"+n).value.trim().toLowerCase(),r=v===w;if(r)ok++;
    $("#q"+n).className="q "+(r?"ok":"no");$("#f"+n).innerHTML=r?"✅ 正確":`❌ 正確答案：${w}`;$("#f"+n).style.color=r?"#3a9d5d":"#d9534f"});
  $("#score").textContent=`得分：${ok} / ${qs.length}`;
}
side();render();
</script>
</body>
</html>
